      if(k==='register')toast('Account created. Let’s set up your profile.');
      render();
    }else if(k==='scorelogin'){
      const d=Object.fromEntries(new FormData(form));
      S.busy=true;const u=await login(null,d.email,d.password);S.busy=false;S.score=u.id;go('score');
    }else if(k==='sprofile'){
      const stage=S.pstage||stu().stage;if(!stage)throw'Choose your stage first.';
      const{d,first}=validateForm(form,stageSections(stage),stage);
      if(first){setErr('Please fix the highlighted fields.');return}
      const s=stu();s.stage=stage;s.profile={...d};touch(s);save();S.pstage=null;S.pdraft=null;
      toast('Profile saved ✓');S.tab='vault';render();
    }else if(k==='fprofile'){
      const{d,first}=validateForm(form,FAM_SECTIONS(),null);
      if(first){setErr('Please fix the highlighted fields.');return}
      d.linkCode=d.linkCode.toUpperCase();
      const f=fam();f.profile={...d};touch(f);save();S.pdraft=null;toast('Profile saved ✓');S.tab='kid';render();
    }else if(k==='addskill'){
      const d=Object.fromEntries(new FormData(form)),file=form.querySelector('input[type=file]').files[0];
      if(!String(d.skill).trim())throw'Enter a skill name.';
      if(!file)throw'A proof certificate is required — skills without proof are not accepted.';
      if(file.size>900*1024)throw'Proof file is too large (max 900 KB).';
      const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej('Could not read the file.');r.readAsDataURL(file)});
      const v=ensureVault();v.skills.push({name:d.skill.trim(),level:d.level,issuer:(d.issuer||'').trim(),proofName:file.name,proofData:data});v.rev=(v.rev||0)+1;touch(stu());save();toast('Skill added with proof ✓');render(true);
    }else if(k==='famanswers'){
      await submitAnswers(Object.fromEntries(new FormData(form)));
    }
  }catch(err){S.busy=false;setErr(typeof err==='string'?err:(err&&err.message)||'Something went wrong.',k==='addskill'?'err2':'err');const b=form.querySelector('button');if(b)b.disabled=false}
});

/* ================= backup & restore ================= */
async function exportMine(){
  const u=curUser();if(!u)return;
  const rec=u.role==='student'?DB.students[u.id]:DB.families[u.id];
  const payload={app:'careermitra',v:1,exported:Date.now(),role:u.role,user:u,record:rec};
  let dl=null;try{dl=await claude.use('downloads')}catch(x){}
  if(!dl){toast('Downloads are not available in this view.');return}
  try{await dl.save({filename:`careermitra-backup-${u.email.split('@')[0]}.json`,data:JSON.stringify(payload)});toast('Backup ready ✓')}
  catch(x){if(!x||x.code!=='declined')toast('Could not save the backup.')}
}
function importBackup(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);
        if(!p||p.app!=='careermitra'||!p.user||!p.user.email||!p.record||!['student','family'].includes(p.role))throw 0;
        const ex=DB.users.find(x=>x.email===p.user.email);
        if(ex&&ex.id!==p.user.id){toast('A different account with this email already exists on this device.');return res()}
        const store=p.role==='student'?DB.students:DB.families;
        if(ex&&(store[ex.id]||{}).updated>=(p.record.updated||0)){toast('This device already has newer data for that account — nothing changed.');return res()}
        if(!ex)DB.users.push(p.user);else Object.assign(ex,{salt:p.user.salt,hash:p.user.hash});
        store[p.user.id]=p.record;save();
        toast('Backup restored ✓ Log in with your email and password.');
      }catch(x){toast('That file is not a valid CareerMitra backup.')}
      res();
    };
    r.onerror=()=>{toast('Could not read the file.');res()};
    r.readAsText(file);
  });
}

/* ================= test flow ================= */
function persistDraft(){const s=stu();s.testDraft={q:S.tq.q,a:S.tq.a,i:S.tq.i,src:S.tq.src,rev:(s.vault||{}).rev};save()}
async function startTest(){
  const s=stu();delete s.testDraft;S.tstate='loading';S.tload=0;window.CM_AI_ERROR='';render();
  const r=await makeQuestions(s);
  if(!r||!Array.isArray(r.q)||r.q.length!==TQ_N){
    S.tstate='idle';
    const msg=window.CM_AI_ERROR||'The AI could not generate the complete test. Please try again.';
    toast(msg);
    render();
    return;
  }
  S.tq={q:r.q,a:Array(TQ_N).fill(null),i:0,src:r.src||'ai',sources:r.sources||window.CM_TEST_AI_SOURCES||{}};S.tstate='running';persistDraft();render();
}
function localTestAnalysis(tally,reasoning,v){
  const order=[...LET].sort((a,b)=>(tally[b]||0)-(tally[a]||0));
  const labels={R:'hands-on and practical problem solving',I:'analysis, investigation and learning',A:'creative expression and new ideas',S:'people, communication and helping others',E:'leadership, initiative and decision making',C:'structure, organisation and accuracy'};
  const strengths=order.filter(k=>(tally[k]||0)>0).slice(0,3).map(k=>labels[k]);
  const interests=[...arr(v.interests),...arr(v.hobbies),...arr(v.likings),...subjNames(v)].filter(Boolean).slice(0,6);
  const traits=order.filter(k=>(tally[k]||0)>0).slice(0,5).map(k=>({R:'Practical',I:'Analytical',A:'Creative',S:'Supportive',E:'Enterprising',C:'Organised'}[k]));
  return{
    summary:`Your Test Zone shows ${strengths.slice(0,2).join(' and ')||'a mixed pattern'}, but the personalised career-role analysis could not be verified right now. CareerMitra will not guess job roles from generic Holland mappings.`,
    personalityType:'Test Zone pattern — career analysis unavailable',
    coreInterests:interests,
    traits,
    careerDirections:[],
    rankedCareers:[],
    careerInclination:'Career roles will appear only after the AI has produced a complete evidence-based analysis of your actual Test Zone responses.'
  };
}
async function finishTest(){
  const s=stu(),{q,a}=S.tq,tally={R:0,I:0,A:0,S:0,E:0,C:0};let reasoning=0;
  const responses=q.map((qq,i)=>{
    const o=qq.o[a[i]];
    if(o&&o.trait)tally[o.trait]++;else if(o&&o.correct)reasoning++;
    return{category:qq.cat,question:qq.q,option:o?o.text:'',trait:o&&o.trait||null,correct:o&&o.correct===true};
  });
  S.tstate='analysing';render();
  const v=s.vault;
  const analysisPrompt=`You are CareerMitra’s neutral, humble and careful career-analysis AI for Test Zone responses. You are NOT a recruiter, marketer, parent or career seller.

Your task is to understand this student from the evidence they actually gave. Do not push them toward any career.

NON-NEGOTIABLE RULES
- Use ONLY the supplied Personal Vault and the student’s actual Test Zone responses.
- Do not use popularity, prestige, salary, social status, government/private preference, gender stereotypes, region stereotypes or your own idea of a “good career”.
- The student’s non-negotiable career and preferred roles are evidence of preference, not proof of aptitude or the correct answer.
- Do not let a named career dominate the result merely because it appears in the Vault.
- Do not infer personality from a factual question being answered correctly. Use factual questions only for the reasoning/knowledge part.
- Look for patterns across multiple responses. One answer should rarely decide a conclusion.
- Separate what the student clearly showed from what is uncertain.
- If the evidence is weak or mixed, say so. Do not manufacture confidence.
- Career suggestions must come from the student’s evidence, not from a fixed “best careers” list. You may return a career not present in the app’s structured database.
- Be neutral, respectful, soft-spoken and easy to understand. Never say the student “should” choose a career.

PERSONAL VAULT:
${JSON.stringify({stage:s.stage,interests:v.interests,hobbies:v.hobbies,likings:v.likings,strongSubjects:subjNames(v),verifiedSkills:skillNames(v),preferredRoles:roleNames(v),nonNegotiable:v.nonnegotiable,field:v.field,whyField:v.whyField,whyNotOthers:v.whyNotOthers,alternatives:v.alternatives})}

TEST RESPONSES (the chosen option text is the important evidence):
${JSON.stringify(responses)}

TECHNICAL TALLY (secondary context only; do not let it override the actual responses):
${JSON.stringify(tally)}
Reasoning questions correct: ${reasoning}

ANALYSIS TASK
1. Give a short, gentle summary of the observed pattern.
2. List core interests only when they are supported by repeated Vault/test evidence.
3. Give a few neutral traits that describe observed behaviour, not labels of worth.
4. Give 3–5 concrete job roles when the supplied evidence supports them. Rank them only by how well the student’s own evidence fits. If evidence is genuinely insufficient, return fewer than 3 rather than inventing roles.
4A. Every returned job role must be a real occupational role, not a Holland category such as “analytical careers” or “technical careers”.
4B. At least 2 evidence points for each role must explicitly trace to the student’s actual Vault/test responses. Do not use the role name itself as evidence.
5. For every career direction give: exact name, fit Strong/Moderate/Possible, 2–5 evidence points tied to the student’s actual responses, possible watchouts or missing evidence, and a short reason.
6. For EVERY ranked career, also create a complete job profile inside the profile object. The profile must describe that exact occupational role and must never be a generic template copied across roles. The profile must be specific to that exact career, not a generic template.
7. The profile MUST contain: summary, pros, cons, market, demand, pay, future, education, vocational, courses, path, skills, alternatives and caution.
8. Pros/cons/demand/market/future must be career-specific. Do not copy the same text across careers.
9. Education and path must match the exact role. Never say a generic “relevant bachelor’s degree” when the role has a known specific route. If the route is uncertain, explicitly say that it needs verification instead of guessing.
10. Courses means useful learning subjects/courses/certifications, not random certificate collecting. Give only options that genuinely support the role.
11. Market, demand, pay and future are dynamic. Do NOT invent precise salary figures, job counts, percentages, employer names or guaranteed outcomes. If current evidence is unavailable, say “needs live verification” in the profile caution.
12. Zero false personalization: every reason for why the student fits must trace to their Vault or actual test responses. Never invent a project, skill, mark, qualification, interest or experience.
13. A career must not appear only because it is prestigious, popular, high-paying or present in the static app database.
14. Return fewer careers if the evidence is weak. Do not fill the list.
15. Include careerDirections such as broad work styles only when supported by the evidence.
16. If the student’s answers are genuinely mixed, say “mixed evidence” rather than forcing a clean personality story.

RETURN ONLY JSON:
{"summary":"2-4 simple sentences","personalityType":"short neutral description","coreInterests":["..."],"traits":["..."],"careerDirections":["..."],"rankedCareers":[{"name":"career direction","fit":"Strong|Moderate|Possible","score":0.0,"evidence":["..."],"watchouts":["..."],"tradeoffs":["..."],"reason":"...","path":["..."],"alternatives":["..."],"profile":{"summary":"exact-role summary","pros":["..."],"cons":["..."],"market":"...","demand":"...","pay":"...","future":"...","education":"exact education route","vocational":"exact vocational/diploma route or clearly unavailable","courses":["..."],"path":["step 1...","step 2...","step 3..."],"skills":["..."],"alternatives":["..."],"caution":"what still needs verification"}}],"careerInclination":"1-2 gentle sentences"}`;

  let r=await aiJson(analysisPrompt);
  const validCareerAnalysis=x=>!!(x&&typeof x.summary==='string'&&Array.isArray(x.rankedCareers)&&x.rankedCareers.length>0&&Array.isArray(x.traits)&&Array.isArray(x.coreInterests)&&x.rankedCareers.every(c=>c&&typeof c.name==='string'&&c.name.trim()&&c.profile&&typeof c.profile==='object'));
  let usedAI=validCareerAnalysis(r);
  if(!usedAI && !/429|rate limit|rate_limit|quota/i.test(window.CM_AI_ERROR||'')){
    r=await aiJson(analysisPrompt+`\n\nRECOVERY PASS: Re-read every supplied response. Return a complete valid JSON analysis. Do not invent a career preference and do not omit rankedCareers if there is enough evidence. If evidence is insufficient, return fewer careers. JSON only.`,{bypassCache:true});
    usedAI=validCareerAnalysis(r);
  }
  if(!usedAI){
    r=localTestAnalysis(tally,reasoning,v);
    usedAI=false;
  }
  const aiPayload={
    summary:String(r.summary||''),coreInterests:arr(r.coreInterests).slice(0,6).map(String),traits:arr(r.traits).slice(0,8).map(String),
    careerInclination:String(r.careerInclination||''),personalityType:String(r.personalityType||''),
    careerDirections:arr(r.careerDirections).slice(0,6).map(String),rankedCareers:arr(r.rankedCareers).slice(0,8).map(x=>{const p=(x&&x.profile&&typeof x.profile==='object')?x.profile:{};return{name:String(x&&x.name||''),fit:String(x&&x.fit||'Possible'),score:typeof x?.score==='number'?x.score:null,evidence:arr(x&&x.evidence).slice(0,5).map(String),watchouts:arr(x&&x.watchouts).slice(0,5).map(String),tradeoffs:arr(x&&x.tradeoffs).slice(0,5).map(String),reason:String(x&&x.reason||''),path:arr(x&&x.path).slice(0,6).map(String),alternatives:arr(x&&x.alternatives).slice(0,6).map(String),profile:{summary:String(p.summary||''),pros:arr(p.pros).slice(0,5).map(String),cons:arr(p.cons).slice(0,5).map(String),market:String(p.market||''),demand:String(p.demand||''),pay:String(p.pay||''),future:String(p.future||''),education:String(p.education||''),vocational:String(p.vocational||''),courses:arr(p.courses).slice(0,8).map(String),path:arr(p.path).slice(0,8).map(String),skills:arr(p.skills).slice(0,10).map(String),alternatives:arr(p.alternatives).slice(0,8).map(String),caution:String(p.caution||'')}}}).filter(x=>x.name)
  };
  s.test={tally,reasoning,takenAt:Date.now(),aiSource:usedAI?'ai':'builtin',rev:v.rev,ai:aiPayload,responses};
  s.progress.score=false;s.progress.options=false;delete s.testDraft;
  touch(s);save();S.tstate='idle';S.tq=null;S.tab='score';toast('Test complete — here’s your scorecard');render();
}

/* ================= family flow ================= */
function rate(status){
  const f=fam();
  if(status==='supportive'&&S.rating<7){setErr('A rating below 7 suggests you have concerns. Raise the rating to 7+ or choose “I’m unsatisfied”.');return}
  f.rating=S.rating;f.status=status;touch(f);save();
  if(status==='supportive'){toast('Thank you — your support has been recorded.');S.tab='issues';render()}
  else{S.tab='issues';render();if(!arr(f.questions).length)genFQ()}
}
async function genFQ(){
  const f=fam(),s=linkedStudent(),an=analyse(s);S.fq='loading';render();
  const vault=s&&s.vault?s.vault:{};
  const familyPrompt=`You are CareerMitra's neutral family-perspective question designer.

STUDENT DATA (use only to make questions relevant; never assume the student is right or wrong):
${JSON.stringify({interests:arr(vault.interests),hobbies:arr(vault.hobbies),likings:arr(vault.likings),subjects:subjNames(vault),skills:skillNames(vault),preferredRoles:roleNames(vault),field:vault.field||'',nonNegotiable:vault.nonnegotiable||'',alternatives:arr(vault.alternatives)})}

The family member has chosen to share their perspective. Create exactly 25 short, simple, respectful and non-leading questions. The purpose is to understand the family's actual views, not to persuade them toward or away from a career.

COVER DIFFERENT AREAS WITHOUT ASSUMING A PROBLEM:
- what the family values in a career
- what they understand about the student's interests and choices
- what they support and what they are uncertain about
- education/training length and effort
- cost, affordability, loans or financial limits only if relevant to them
- income expectations and how important they are
- job stability and future uncertainty
- location, travel or living away from home if relevant
- work-life and workload concerns
- social pressure or respect only as an optional concern, not an assumption
- safety/risk where relevant
- alternatives they would accept
- what evidence, trial, mentor, internship or results would increase confidence
- what the student could explain better to the family
- what the family hopes the student's working life will look like
- what the family is willing to support

NEUTRALITY RULES:
- Never assume the family opposes the student's choice.
- Never assume a government job, high salary, prestige, medicine, engineering, technology, business or any other path is better.
- Never word a question so that one answer sounds more loving, responsible or intelligent.
- If asking about a concern, allow “I do not have this concern” as a valid answer.
- Use the student's actual Vault terms naturally, but do not repeat the same career or interest in every question.
- Avoid asking the family to rank “best” careers. Ask about their own priorities and reasons.
- Very simple English. One clear idea per question.

RETURN ONLY JSON: {"questions":["..."]} with exactly 25 genuinely different questions.`;
  let r=await aiJson(familyPrompt);
  let base=r&&Array.isArray(r.questions)?r.questions.map(String).filter(x=>x.trim().length>10):[];
  if(base.length<25 && !/429|rate limit|rate_limit|quota/i.test(window.CM_AI_ERROR||'')){
    r=await aiJson(familyPrompt+`

RECOVERY PASS: Generate all 25 again. Make them neutral, non-leading, distinct and simple. Return exactly 25 questions. JSON only.`,{bypassCache:true});
    base=r&&Array.isArray(r.questions)?r.questions.map(String).filter(x=>x.trim().length>10):[];
  }
  const loc=FQ_LOCAL(an.roles.slice(0,4).map(r=>r.n).join(', '));
  f.questions=base.length>=25?base.slice(0,25):loc;
  touch(f);save();S.fq=null;render();
}

async function submitAnswers(d){
  const f=fam();S.busy=true;
  const items=f.questions.map((q,i)=>({q,a:(d['a'+i]||'').trim()})).filter(x=>x.a);
  if(!items.length)throw'Please answer at least one question.';
  const prev=q=>f.qa.find(x=>x.q===q&&x.accepted);
  const res=items.map((it,i)=>({...it,keep:!!(prev(it.q)&&prev(it.q).a===it.a),note:localGenuine(it.a,items.filter((_,j)=>j!==i).map(x=>x.a))}));
  const pass=res.filter(r=>!r.note&&!r.keep);
  if(pass.length){
    const judgePrompt=`You are CareerMitra's neutral family-answer analyst. Review each family answer against its question.
Return ONLY JSON with one result for each item in the same order.
For each answer:
- ok: true only when it is a sincere, relevant answer. Short honest answers are allowed.
- reason: a short kind reason only if ok=false.
- stance: one of "supportive","concern","preference","mixed","neutral".
- dimensions: choose only dimensions clearly present: ["interest","income","cost","stability","future","education","competition","location","worklife","risk","social","skills","government","family_time","safety"].
- evidence: 1 short sentence describing what the parent actually said, without adding assumptions.
- strength: "clear","moderate" or "weak".
Never infer a concern that the parent did not express. Never label generic support as support for a specific career.

ITEMS (${pass.length}): ${JSON.stringify(pass.map(p=>({q:p.q,a:p.a})))}`;
    let j=await aiJson(judgePrompt);
    if(!(j&&Array.isArray(j.results)&&j.results.length===pass.length) && !/429|rate limit|rate_limit|quota/i.test(window.CM_AI_ERROR||'')){
      j=await aiJson(judgePrompt+`

RECOVERY PASS: Return exactly ${pass.length} results in the same order. Do not omit or merge items. JSON only.`,{bypassCache:true});
    }
    if(j&&Array.isArray(j.results)&&j.results.length===pass.length){
      pass.forEach((p,i)=>{
        const z=j.results[i]||{};
        if(z.ok===false)p.note=z.reason||'This answer does not seem to address the question. Please try again.';
        p.ai={stance:['supportive','concern','preference','mixed','neutral'].includes(z.stance)?z.stance:'neutral',dimensions:Array.isArray(z.dimensions)?z.dimensions.filter(x=>['interest','income','cost','stability','future','education','competition','location','worklife','risk','social','skills','government','family_time','safety'].includes(x)).slice(0,6):[],evidence:String(z.evidence||'').trim(),strength:['clear','moderate','weak'].includes(z.strength)?z.strength:'weak'};
      });
    }
  }
  f.qa=res.map(r=>({q:r.q,a:r.a,accepted:r.keep?true:!r.note,note:r.keep?'':(r.note||''),ai:r.ai||null}));touch(f);save();S.busy=false;
  const acc=accepted(f);
  toast(acc>=fqMin(f)?'Answers saved — they will appear in the Scorecard panel':`${acc} accepted so far. At least ${fqMin(f)} genuine answers are needed.`);render(true);
}

render();
