<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareerMitra — Your Career Friend</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6fb;--card:#ffffff;--ink:#1a1f33;--muted:#667089;--line:#e3e6f0;--brand:#4f46e5;--brand2:#7c3aed;--chip:#eceeff;--ok:#0f9d6b;--okbg:#e3f6ee;--warn:#b45309;--warnbg:#fff3df;--bad:#dc2626;--badbg:#fdeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f121b;--card:#181c29;--ink:#eaedf7;--muted:#98a1ba;--line:#2a3042;--brand:#8b85ff;--brand2:#a78bfa;--chip:#262b45;--ok:#34d399;--okbg:#10332a;--warn:#fbbf24;--warnbg:#382c10;--bad:#f87171;--badbg:#3a1a1a}}
:root[data-theme="dark"]{--bg:#0f121b;--card:#181c29;--ink:#eaedf7;--muted:#98a1ba;--line:#2a3042;--brand:#8b85ff;--brand2:#a78bfa;--chip:#262b45;--ok:#34d399;--okbg:#10332a;--warn:#fbbf24;--warnbg:#382c10;--bad:#f87171;--badbg:#3a1a1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 16px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.3px;cursor:pointer}
.logo b{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-size:30px;line-height:1.15;margin:0 0 8px;letter-spacing:-.5px}
h2{font-size:20px;margin:0 0 6px}
h3{font-size:16px;margin:16px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:760px){.grid3,.grid2{grid-template-columns:1fr}}
.panel{cursor:pointer;transition:.15s;border-top:4px solid var(--brand)}
.panel:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(79,70,229,.15)}
.panel .ico{font-size:30px}
.btn{appearance:none;border:0;background:linear-gradient(90deg,var(--brand),var(--brand2));color:#fff;padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--chip);color:var(--brand)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
/* stepper */
.stepper{display:flex;gap:0;overflow-x:auto;padding:4px 0 14px;margin-bottom:6px}
.st{flex:1;min-width:92px;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;color:var(--muted);position:relative;padding:0 4px}
.st:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.st:first-child:before{display:none}
.st.done:before,.st.on:before{background:var(--brand)}
.st i{width:32px;height:32px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:14px;z-index:1}
.st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.st.on i{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px var(--chip)}
.st.on span{color:var(--ink);font-weight:700}
.st span{font-size:12.5px;text-align:center}
.st:disabled{cursor:not-allowed;opacity:.55}
.prog{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.next{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:2px solid var(--brand);background:var(--chip)}
.next b{color:var(--ink)}
/* forms */
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
@media(max-width:760px){.fg{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
label.f.wide{grid-column:1/-1}
label.f small{font-weight:400}
.ferr{color:var(--bad);min-height:0;font-size:12.5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
input[type=range]{padding:0}
.chip{display:inline-block;background:var(--chip);color:var(--brand);padding:3px 10px;border-radius:99px;font-size:13px;margin:2px 4px 2px 0;font-weight:500}
.chip.alt{background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.chip b{cursor:pointer;margin-left:6px;opacity:.7}
.chip.sug{cursor:pointer;background:var(--bg);border:1px dashed var(--line);color:var(--muted)}
.chip.sug:hover{border-color:var(--brand);color:var(--brand)}
.note{padding:10px 12px;border-radius:10px;font-size:14px;margin:10px 0}
.note.ok{background:var(--okbg);color:var(--ok)}.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}.note.info{background:var(--chip);color:var(--brand)}
.err{color:var(--bad);font-size:14px;margin:8px 0;min-height:1px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;font:inherit;color:var(--ink)}
.opt:hover{border-color:var(--brand)}.opt.on{border-color:var(--brand);background:var(--chip);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.trait{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:6px 0;font-size:14px}

details.role{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--card)}
details.role>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.role>summary::-webkit-details-marker{display:none}
details.role .in{padding:0 16px 16px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.pc{grid-template-columns:1fr}}
.pc ul{margin:4px 0 0;padding-left:18px}
.pros{background:var(--okbg);border-radius:12px;padding:10px 14px}.cons{background:var(--warnbg);border-radius:12px;padding:10px 14px}
.pros h4,.cons h4{margin:0 0 2px;font-size:14px}
.fit{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.fit.s{background:var(--okbg);color:var(--ok)}.fit.g{background:var(--chip);color:var(--brand)}.fit.p{background:var(--warnbg);color:var(--warn)}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
.code{font:700 22px ui-monospace,Menlo,monospace;letter-spacing:2px;background:var(--chip);color:var(--brand);padding:8px 14px;border-radius:10px;display:inline-block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;max-width:90vw}
.qa{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.big{font-size:40px;font-weight:800;color:var(--brand)}
.skill{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}
/* stage cards */
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
@media(max-width:900px){.stages{grid-template-columns:repeat(2,1fr)}}
.stg{cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);text-align:left;font:inherit;color:var(--ink)}
.stg:hover{border-color:var(--brand)}.stg.on{border-color:var(--brand);background:var(--chip)}
.stg .e{font-size:24px}.stg b{display:block}.stg span{font-size:12px;color:var(--muted)}
/* vault sections */
.vs{border-left:4px solid var(--line)}
.vs.saved{border-left-color:var(--ok)}
.vs h2 .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--chip);color:var(--brand);align-items:center;justify-content:center;font-size:13px;margin-right:8px}
.vs.saved h2 .n{background:var(--ok);color:#fff}
.tags{min-height:34px;margin-bottom:8px}
.cc{font-size:12px;color:var(--muted);text-align:right}
.basedon{font-size:12px;background:var(--okbg);color:var(--ok);padding:3px 10px;border-radius:99px;display:inline-block;margin-top:6px}
.snap{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
@media(max-width:560px){.snap{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:2px 9px;margin:2px 4px 2px 0;font-weight:600}
.pill.y{background:var(--okbg);color:var(--ok)}.pill.n{background:var(--line);color:var(--muted)}.pill.w{background:var(--warnbg);color:var(--warn)}
details.j>summary{cursor:pointer;font-weight:700;list-style:none}
details.j>summary::-webkit-details-marker{display:none}
/* ================= intro / welcome page ================= */
.intro-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:38px 22px 48px;position:relative;overflow:hidden;background:#07090e}
.intro-page:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 18%,rgba(124,114,255,.16),transparent 30%),radial-gradient(circle at 82% 12%,rgba(167,139,250,.12),transparent 27%),radial-gradient(circle at 55% 92%,rgba(99,102,241,.09),transparent 34%)}
.intro-page:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black 0%,transparent 90%)}
.intro-shell{width:min(1180px,100%);position:relative;overflow:hidden;border:1px solid rgba(167,139,250,.24);border-radius:32px;background:linear-gradient(145deg,rgba(15,18,27,.98),rgba(7,10,16,.99));padding:42px 46px 38px;box-shadow:0 32px 100px rgba(0,0,0,.62),0 0 100px rgba(124,114,255,.08);isolation:isolate}
.intro-shell:before{content:"";position:absolute;inset:1px;border-radius:31px;border:1px solid rgba(255,255,255,.035);pointer-events:none}.intro-shell>*{position:relative;z-index:1}
.intro-glow{position:absolute!important;width:440px;height:440px;border-radius:50%;background:rgba(124,114,255,.13);filter:blur(85px);right:-170px;top:-190px;pointer-events:none;animation:introPulse 6s ease-in-out infinite}@keyframes introPulse{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.12);opacity:1}}
.intro-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}.intro-brand{display:inline-flex;align-items:center;gap:11px;color:#f2f3f8;font-weight:900;font-size:24px;letter-spacing:-.7px}.intro-brand span:last-child{text-shadow:0 0 26px rgba(167,139,250,.18)}
.intro-mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#7167ff,#b59cff);color:#fff;font-weight:950;box-shadow:0 12px 38px rgba(124,114,255,.38),inset 0 1px 0 rgba(255,255,255,.35);animation:introLogo 3.2s ease-in-out infinite}@keyframes introLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.intro-badge{border:1px solid rgba(167,139,250,.22);background:rgba(124,114,255,.07);padding:8px 12px;border-radius:999px;color:#aeb5c9;font-size:11px;font-weight:750;letter-spacing:.4px}
.intro-hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:42px;align-items:center}.intro-kicker{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;color:#b8a8ff;font-size:12px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase}.intro-kicker:before{content:"";width:24px;height:2px;border-radius:2px;background:#9b8cff;box-shadow:0 0 12px #9b8cff}
.intro-title{max-width:780px;color:#fff;font-size:clamp(43px,5.5vw,70px);line-height:1.01;letter-spacing:-3.2px;margin:0 0 20px}.intro-title span{display:block;background:linear-gradient(90deg,#d8d0ff,#9d91ff 45%,#c8baff 75%,#fff);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:introGradient 5s linear infinite}@keyframes introGradient{to{background-position:220% center}}
.intro-copy{max-width:760px;color:#a9b1c3;font-size:16px;line-height:1.72;margin:0 0 25px}.intro-actions{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.intro-cta{padding:15px 25px!important;border-radius:13px!important;font-size:15px!important;font-weight:900!important;background:linear-gradient(135deg,#8176ff,#aa9bff)!important;border:1px solid rgba(255,255,255,.2)!important;box-shadow:0 15px 38px rgba(124,114,255,.28),0 0 30px rgba(124,114,255,.08);transition:.2s ease;animation:ctaGlow 3s ease-in-out infinite}.intro-cta:hover{transform:translateY(-3px);box-shadow:0 22px 52px rgba(124,114,255,.42),0 0 36px rgba(167,139,250,.18)}@keyframes ctaGlow{50%{box-shadow:0 20px 50px rgba(124,114,255,.4),0 0 0 7px rgba(167,139,250,.04)}}.intro-sub{color:#727d92;font-size:11px}
.intro-visual{position:relative;min-height:285px;border:1px solid rgba(167,139,250,.18);border-radius:24px;background:linear-gradient(145deg,rgba(23,27,40,.92),rgba(10,13,21,.92));padding:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 20px 45px rgba(0,0,0,.25)}.intro-visual:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(139,133,255,.12);filter:blur(40px);right:-50px;bottom:-40px}.visual-title{color:#eef0f7;font-size:12px;font-weight:850;margin-bottom:14px}.visual-card{border:1px solid #2b3040;border-radius:14px;background:rgba(10,13,20,.86);padding:13px;margin-top:9px}.visual-card b{font-size:12px;color:#f0f2f8}.visual-card span{display:block;color:#7f899d;font-size:11px;margin-top:4px}.visual-score{display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding-top:14px;border-top:1px solid #272c3b}.visual-score strong{font-size:25px;color:#b9afff}.visual-score small{color:#7f899d}
.intro-section{margin-top:36px}.intro-section-title{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:13px}.intro-section-title h2{color:#fff;font-size:19px;margin:0}.intro-section-title p{color:#737d91;font-size:11px;margin:0}.intro-features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.intro-feature{border:1px solid #272d3c;border-radius:17px;background:linear-gradient(145deg,#121620,#0c1018);padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:.2s ease}.intro-feature:hover{transform:translateY(-4px);border-color:rgba(167,139,250,.42);box-shadow:0 16px 34px rgba(0,0,0,.28),0 0 28px rgba(139,133,255,.08)}.intro-feature .fi{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:rgba(139,133,255,.1);border:1px solid rgba(167,139,250,.15);font-size:19px;margin-bottom:12px}.intro-feature h3{color:#eef1f8;margin:0 0 5px;font-size:14px}.intro-feature p{color:#8b95aa;font-size:12px;margin:0;line-height:1.55}
.intro-flow{margin-top:30px;border-top:1px solid #252b39;padding-top:24px}.intro-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.intro-step{border:1px solid #272d3d;border-radius:14px;padding:15px;background:linear-gradient(145deg,#11151e,#0c1017);transition:.2s ease}.intro-step:hover{transform:translateY(-3px);border-color:rgba(167,139,250,.35)}.intro-step b{display:block;color:#f0f2f8;font-size:12px}.intro-step span{display:block;color:#7f899f;font-size:11px;margin-top:4px;line-height:1.45}.intro-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#242941;color:#a99cff;font-size:10px;font-weight:900;margin-bottom:9px}.intro-bottom{text-align:center;margin-top:28px;padding-top:22px;border-top:1px solid #252b39}.intro-bottom-label{color:#858fa4;font-size:12px;margin-bottom:9px}.intro-bottom-label b{color:#d7d1ff}.intro-bottom .intro-cta{min-width:220px}
@media(max-width:900px){.intro-shell{padding:34px 28px}.intro-hero{grid-template-columns:1fr}.intro-visual{min-height:auto}.intro-features{grid-template-columns:1fr}.intro-steps{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.intro-page{padding:18px 12px}.intro-shell{padding:25px 18px;border-radius:23px}.intro-top{margin-bottom:27px}.intro-badge{display:none}.intro-title{font-size:42px;letter-spacing:-2px}.intro-copy{font-size:14px}.intro-steps{grid-template-columns:1fr}.intro-bottom .intro-cta{width:100%}}

<body>
<div class="wrap"><div id="app"><div class="intro-page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:#07090e;color:#fff"><div style="max-width:760px;width:100%;padding:36px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(16,18,28,.92);box-shadow:0 20px 80px rgba(0,0,0,.35)"><div style="font-size:14px;letter-spacing:.12em;color:#a78bfa;font-weight:800">CAREERMITRA</div><h1 style="font-size:42px;line-height:1.05;margin:14px 0">Your career. Your family.<br><span style="color:#a78bfa">One clearer decision.</span></h1><p style="color:#aeb4c4;line-height:1.7">AI-enabled career counselling and family decision support — connecting the student profile, Personal Vault, AI Test Zone, family perspective and Scorecard.</p><button class="btn intro-cta" data-act="platform" type="button">Enter CareerMitra →</button></div></div></div></div>
<script>
window.addEventListener('error',function(e){
  var app=document.getElementById('app');
  if(app && !app.dataset.cmFatal){
    app.dataset.cmFatal='1';
    app.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#07090e;color:#fff;font-family:system-ui,sans-serif"><div style="max-width:720px;width:100%;padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:#10121c"><h2 style="margin-top:0">CareerMitra could not start</h2><p style="color:#aeb4c4">A browser-side JavaScript error stopped the app. Refresh once. If it still happens, open the browser console and share the red error with me.</p><pre style="white-space:pre-wrap;color:#ffb4b4;background:#080a10;padding:14px;border-radius:12px;overflow:auto">'+String(e.message||e.error||e).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre></div></div>';
  }
});
</script>
<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rx=k=>new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)','i');

/* ================= auth (salted PBKDF2; no plain passwords stored) ================= */
async function hashPw(pw,salt){
  if(!(window.crypto&&crypto.subtle))throw 'Secure crypto is not available in this browser.';
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function register(role,email,pw,pw2){
  email=email.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))throw 'Enter a valid email address.';
  if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw))throw 'Password needs 8+ characters with letters and numbers.';
  if(pw!==pw2)throw 'Passwords do not match.';
  if(DB.users.some(u=>u.email===email))throw 'This email is already registered. Please log in instead.';
  const salt=uid()+uid(),hash=await hashPw(pw,salt);
  const u={id:uid(),email,role,salt,hash,created:Date.now(),lastLogin:Date.now()};
  DB.users.push(u);
  if(role==='student')DB.students[u.id]={stage:null,profile:null,vault:null,test:null,progress:{},linkCode:'CM-'+Math.random().toString(36).slice(2,8).toUpperCase(),updated:Date.now()};
  else DB.families[u.id]={profile:null,rating:null,status:null,qa:[],questions:null,progress:{},updated:Date.now()};
  save();return u;
}
async function login(role,email,pw){
  email=email.trim().toLowerCase();
  const u=DB.users.find(x=>x.email===email);
  if(!u)throw 'No account found for this email on this device. Register, or restore a backup.';
  if((await hashPw(pw,u.salt))!==u.hash)throw 'Incorrect password.';
  if(role&&u.role!==role)throw `This email is registered as a ${u.role}, not a ${role}. Use the ${u.role} panel.`;
  u.prevLogin=u.lastLogin;u.lastLogin=Date.now();save();
  return u;
}

/* ================= AI via same-origin Vercel API (with fallbacks) ================= */
let AI_READY=true;
const CM_AI_CACHE_KEY='cm_ai_cache_v2';
const CM_AI_CACHE_TTL=7*24*60*60*1000;
const CM_AI_INFLIGHT=new Map();
let CM_AI_QUEUE=Promise.resolve();
let CM_AI_NEXT_AT=0;
let CM_AI_COOLDOWN_UNTIL=0;
function cmHash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function cmSleep(ms){return new Promise(r=>setTimeout(r,Math.max(0,ms)))}
function cmReadCache(key){try{const all=JSON.parse(localStorage.getItem(CM_AI_CACHE_KEY)||'{}');const x=all[key];if(x&&Date.now()-x.t<CM_AI_CACHE_TTL)return x.v;if(x)delete all[key];localStorage.setItem(CM_AI_CACHE_KEY,JSON.stringify(all));}catch(e){}return null}
function cmWriteCache(key,v){try{const all=JSON.parse(localStorage.getItem(CM_AI_CACHE_KEY)||'{}');all[key]={t:Date.now(),v};const keys=Object.keys(all).sort((a,b)=>all[b].t-all[a].t).slice(0,24);const keep={};keys.forEach(k=>keep[k]=all[k]);localStorage.setItem(CM_AI_CACHE_KEY,JSON.stringify(keep));}catch(e){}}
async function ai(){return AI_READY}
async function aiJson(prompt,opts={}){
  if(!prompt||typeof prompt!=='string')return null;
  const webSearch=opts.webSearch===true||/live career research|research this career|internet research|web research/i.test(prompt);
  const isTest=opts.purpose==='student test generation'||/CareerMitra's neutral Test Zone designer|QUESTION PLAN:|PERSONAL VAULT — THIS IS THE ONLY PERSONAL EVIDENCE/i.test(prompt);
  const cacheKey=cmHash((webSearch?'web:':isTest?'test:':'ai:')+prompt);
  // Test Zone must be freshly generated from the current Personal Vault.
  // Never serve a 7-day cached question set for a test request.
  const bypassCache=opts.bypassCache===true||isTest;
  if(!bypassCache){const cached=cmReadCache(cacheKey);if(cached){AI_READY=true;window.CM_AI_ERROR='';return cached}}
  if(CM_AI_INFLIGHT.has(cacheKey))return CM_AI_INFLIGHT.get(cacheKey);
  const job=(CM_AI_QUEUE=CM_AI_QUEUE.then(async()=>{
    try{
      const wait=Math.max(0,CM_AI_NEXT_AT-Date.now(),CM_AI_COOLDOWN_UNTIL-Date.now());
      if(wait)await cmSleep(wait);
      CM_AI_NEXT_AT=Date.now()+450;
      const r=await fetch('/api/ai',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          prompt,
          webSearch,
          career:opts.career||'',
          purpose:isTest?'student test generation':'',
          testZone:isTest,
          vault:opts.vault||null,
          stage:opts.stage||''
        })
      });
      const data=await r.json().catch(()=>null);
      if(!r.ok){
        const retrySec=Number(data&&data.retryAfter)||0;
        if(r.status===429)CM_AI_COOLDOWN_UNTIL=Date.now()+Math.max(5000,Math.min(30000,retrySec*1000||8000));
        const retry=data&&data.retryAfter?` Retry after ${data.retryAfter} seconds.`:'';
        window.CM_AI_ERROR=(data&&data.error)||('API error '+r.status)+retry;
        return null;
      }
      const out=(data&&data.ok&&data.data&&typeof data.data==='object')?data.data:(data&&typeof data==='object'&&!data.error?data:null);
      if(out){
        if(data&&data.serverValidated) out._serverValidated=true;
        const usedFallback=Boolean(data&&data.fallbackUsed);
        AI_READY=!usedFallback;
        window.CM_AI_ERROR=usedFallback?(data.warning||'AI synthesis was temporarily unavailable; source-backed fallback was used.'):'';
        if(usedFallback) out._aiFallback=true;
        if(!bypassCache&&!usedFallback)cmWriteCache(cacheKey,out);
        return out
      }
      window.CM_AI_ERROR=(data&&data.error)||'AI returned no usable data.';
      return null;
    }catch(e){
      window.CM_AI_ERROR=e&&e.message?e.message:String(e);
      return null;
    }
  }).catch(e=>{window.CM_AI_ERROR=e&&e.message?e.message:String(e);return null;}));
  CM_AI_INFLIGHT.set(cacheKey,job);
  try{return await job}finally{CM_AI_INFLIGHT.delete(cacheKey)}
}

function vf(f,val,stage){
  val=String(val==null?'':val).trim();
  if(!val)return f.req===false?'':'This field is required.';
  const n=+val;
  if(f.max&&val.length>f.max)return`Maximum ${f.max} characters allowed.`;
  if(f.ml&&val.length<f.ml)return`Please write at least ${f.ml} characters (${val.length} so far).`;
  switch(f.v){
   case 'name':if(!/^[\p{L}][\p{L} .'\-]{1,59}$/u.test(val))return'Use letters only (2–60 characters).';break;
   case 'phone':{const p=val.replace(/[\s\-]/g,'');if(!/^(\+91)?[6-9]\d{9}$/.test(p))return'Enter a valid 10-digit Indian mobile number.';break}
   case 'pin':if(!/^[1-9]\d{5}$/.test(val))return'PIN code must be 6 digits.';break;
   case 'pct':case 'score':if(isNaN(n)||n<0||n>100)return'Enter a number between 0 and 100.';break;
   case 'year':if(!(n>=1995&&n<=YR+6))return`Enter a year between 1995 and ${YR+6}.`;break;
   case 'url':if(!/^https?:\/\/\S+\.\S+/.test(val))return'Enter a full link starting with https://';break;
   case 'link':if(!studentByCode(val.toUpperCase()))return'No student found with this code. Check it with your child.';break;
   case 'dob':{const d=new Date(val);if(isNaN(d)||d>new Date())return'Enter a valid date of birth.';
     const age=(Date.now()-d)/31557600000,[a,b]=(STAGES[stage]||{age:[5,90]}).age;
     if(age<a||age>b)return`For “${STAGES[stage].t}” age is usually ${a}–${b}. Check the date or choose another stage.`;break}
  }
  return'';
}
function fieldAttrs(f){
  const required=f.req!==false?' required':'', a=[];
  if(f.t==='date') a.push(`max="${TODAY}"`);
  if(f.v==='name') a.push('maxlength="60"','minlength="2"','autocomplete="name"');
  if(f.v==='phone') a.push('maxlength="10"','minlength="10"','inputmode="numeric"','pattern="[6-9][0-9]{9}"','autocomplete="tel"');
  if(f.v==='pin') a.push('maxlength="6"','minlength="6"','inputmode="numeric"','pattern="[1-9][0-9]{5}"');
  if(f.v==='pct'||f.v==='score') a.push('min="0"','max="100"','step="0.01"','inputmode="decimal"');
  if(f.v==='year') a.push('maxlength="4"',`min="1995"`,`max="${YR+6}"`,'inputmode="numeric"','pattern="[0-9]{4}"');
  if(f.v==='url') a.push('maxlength="300"');
  if(f.v==='link') a.push('maxlength="9"','minlength="9"','pattern="CM-[A-Z0-9]{6}"');
  if(['languages','favSubjects','weakSubjects','school','college','university','specialization','ugCollege','pgCollege','pgSpec','ugSpec','targetCourses','targetCourses10','prefLocations','prefLocations10','lastOrg','lastRole','designation'].includes(f.n)) a.push('maxlength="120"');
  if(f.n==='address') a.push('maxlength="250"');
  if(f.t==='textarea'){if(f.ml)a.push(`minlength="${f.ml}"`);a.push('maxlength="2000"');}
  return required+' '+a.join(' ')+(f.attrs?' '+f.attrs:'');
}
function pfield(f,val){
  const rq=f.req===false?' <span class="muted">(optional)</span>':' *',cls='f'+(f.wide||f.t==='textarea'?' wide':'');
  const attrs=fieldAttrs(f);let inp;
  if(f.t==='textarea')inp=`<textarea name="${f.n}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}" data-v="1" ${attrs}>${esc(val)}</textarea>`;
  else if(f.t==='select')inp=`<select name="${f.n}" data-v="1" ${attrs}><option value="">Select…</option>${f.opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else inp=`<input name="${f.n}" type="${f.t||'text'}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" data-v="1" ${attrs}>`;
  return`<label class="${cls}"><span>${f.l}${rq}</span>${inp}${f.help?`<small class="muted">${f.help}</small>`:''}<small class="ferr" id="fe-${f.n}"></small>${f.v==='link'?'<small id="linkinfo"></small>':''}</label>`;
}

function formSections(secs,vals,submitLabel,formName){

}
function validateForm(form,secs,stage){
  const d=Object.fromEntries(new FormData(form));let first=null;
  if(!form.checkValidity()){const bad=form.querySelector(':invalid');if(bad)first=bad.name;}
  secs.forEach(sec=>sec.f.forEach(f=>{const e=vf(f,d[f.n],stage),el=document.getElementById('fe-'+f.n);if(el)el.textContent=e;if(e&&!first)first=f.n;if(typeof d[f.n]==='string')d[f.n]=d[f.n].trim()}));
  if(first){const el=form.querySelector(`[name="${first}"]`);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.focus({preventScroll:true})}}
  return{d,first};
}

function neutralizeLocalOptions(qs,cat){

function vaultTokens(v){
  v=v||{};
  const subjects=[...arr(v.subjects),...arr(v.strongSubjects)];
  const skills=[...arr(v.skills),...arr(v.verifiedSkills)];
  const roles=[...roleNames(v||{}),...arr(v.preferredRolesInPriorityOrder)];
  const alternatives=[...arr(v.alternatives),...arr(v.alternativesConsidered)];
  const raw=[
    ...arr(v.interests),...arr(v.hobbies),...arr(v.likings),
    ...subjects.map(x=>typeof x==='string'?x:x&&x.name),
    ...roles.map(x=>typeof x==='string'?x:x&&x.name),
    ...skills.map(x=>typeof x==='string'?x:x&&x.name),
    v.field,v.chosenField,v.nonnegotiable,v.nonNegotiableCareer,
    ...alternatives
  ].filter(Boolean).map(x=>String(x).trim()).filter(x=>x.length>=3);
  return [...new Set(raw)];
}
function vaultSourceMatch(haystack,source){
  const h=String(haystack||'').toLowerCase();
  const s=String(source||'').toLowerCase().trim();
  if(!s)return false;
  if(h.includes(s))return true;
  const words=s.replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=4);
  if(!words.length)return false;
  const hits=words.filter(w=>h.includes(w)).length;
  return words.length===1?hits===1:hits/words.length>=0.5;
}
function usesVault(qs,v){
  const tokens=vaultTokens(v);
  if(!tokens.length)return 0;
  return qs.filter(q=>{
    const hay=(String(q.basedOn||'')+' '+String(q.q||'')).toLowerCase();
    return tokens.some(t=>hay.includes(t.toLowerCase()));
  }).length;
}

function validQuestions(r,count){
  if(!r||!Array.isArray(r.questions)||r.questions.length!==count)return null;
  const out=[];
  for(const q0 of r.questions){
    if(!q0||typeof q0.q!=='string'||!q0.q.trim()||!Array.isArray(q0.o)||q0.o.length!==4)return null;
    const texts=q0.o.map(o=>String(o&&o.text||'').trim());
    if(texts.some(t=>t.length<1)||new Set(texts.map(t=>t.toLowerCase())).size!==4)return null;
    const factual=q0.o.some(o=>o&&o.correct!==undefined);
    if(factual){
      const correct=q0.o.filter(o=>o&&o.correct===true).length;
      if(correct!==1||q0.o.some(o=>o&&o.trait!==undefined))return null;
    }else{
      const traits=q0.o.map(o=>o&&o.trait);
      if(traits.some(t=>!LET.includes(t))||new Set(traits).size!==4)return null;
    }
    out.push({
      cat:String(q0.cat||'General'),
      basedOn:typeof q0.basedOn==='string'?q0.basedOn:'',
      q:q0.q.trim(),
      o:q0.o.map(o=>o.correct!==undefined?{text:String(o.text).trim(),correct:o.correct===true}:{text:String(o.text).trim(),trait:o.trait})
    });
  }
  return out;
}
function questionQualityIssues(qs,v){
  const issues=[];
  const moral=/\b(best|better|worse|good person|bad person|smart person|lazy|responsible person|irresponsible|should choose|must choose|right career|wrong career|safe choice|only sensible|guaranteed|perfect career)\b/i;
  const leading=/\b(obviously|clearly|of course|definitely|only sensible|dream career|guaranteed|always|never)\b/i;
  const absurd=/\b(do nothing|whatever|i don't care|i dont care|give up immediately|quit everything|sleep all day|ignore it completely)\b/i;
  const seenQ=new Set();
  const namedRoles=[...roleNames(v),v&&v.nonnegotiable,v&&v.field,...arr(v&&v.alternatives)].filter(Boolean).map(x=>String(x).trim().toLowerCase()).filter(x=>x.length>=4);
  qs.forEach((q,i)=>{
    const opts=q.o.map(o=>String(o&&o.text||'').trim());
    const normQ=q.q.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
    if(seenQ.has(normQ))issues.push(`Q${i+1}: repeated question`); seenQ.add(normQ);
    if(!TQ_PLAN.some(([cat])=>cat.toLowerCase()===String(q.cat||'').trim().toLowerCase()))issues.push(`Q${i+1}: invalid category`);
    if(q.q.length>260||opts.some(x=>x.length<3||x.length>160))issues.push(`Q${i+1}: option/question length problem`);
    const lens=opts.map(x=>x.split(/\s+/).filter(Boolean).length);const min=Math.max(1,Math.min(...lens)),max=Math.max(...lens);
    if(max/min>4.2)issues.push(`Q${i+1}: option lengths are not comparable`);
    if(q.cat!=='Basic intelligence'&&opts.some(x=>moral.test(x)||leading.test(x)||absurd.test(x)))issues.push(`Q${i+1}: leading/value-loaded/absurd option`);
    if(q.cat!=='Basic intelligence'&&namedRoles.some(name=>opts.some(x=>x.toLowerCase().includes(name))))issues.push(`Q${i+1}: option directly names a personal career/field`);
    if(new Set(opts.map(x=>x.toLowerCase().replace(/[^a-z0-9 ]/gi,'').replace(/\s+/g,' '))).size<4)issues.push(`Q${i+1}: duplicate options`);
    if(!String(q.basedOn||'').trim())issues.push(`Q${i+1}: missing evidence source`);
  });
  const cats={};qs.forEach(q=>(cats[q.cat]??=[]).push(q));
  for(const [cat,n] of TQ_PLAN){if((cats[cat]||[]).length!==n)issues.push(`${cat}: expected ${n}, got ${(cats[cat]||[]).length}`)}

  // Hard grounding gate: at least 3/4 Interest and 3/4 Subject/Skill and
  // 3/5 Career Opinion questions must reference real Vault evidence. We use
  // semantic token matching, not exact full-string matching, so valid AI wording
  // is not rejected merely because it paraphrases a Vault item.
  const grounding={
    'Interests & likings':[...arr(v&&v.interests),...arr(v&&v.hobbies),...arr(v&&v.likings)],
    'Strong subject / skills':[...arr(v&&v.subjects).map(x=>x&&x.name),...arr(v&&v.skills).map(x=>x&&x.name)],
    'Career opinion':[v&&v.field,v&&v.nonnegotiable,...roleNames(v||{}),...arr(v&&v.alternatives)]
  };
  for(const cat of ['Interests & likings','Strong subject / skills','Career opinion']){
    const src=[...new Set((grounding[cat]||[]).filter(Boolean).map(String))];
    const got=(cats[cat]||[]).filter(q=>src.some(x=>vaultSourceMatch(String(q.basedOn)+' '+q.q,x))).length;
    const required=src.length? (cat==='Career opinion'?3:3) : 0;
    if(required&&got<required)issues.push(`${cat}: insufficient Personal Vault grounding (${got}/${required})`);
  }
  return issues;
}

const CAT_RULES={
 'Personality':'Ask about the student’s natural preferences and everyday working style. Do not mention a career. Options must be four genuinely plausible ways to respond to the same situation, not one obviously admirable answer.',
 'Situation reaction':'Use simple school, study, home, group-work, deadline, mistake or problem situations. Do not mention careers. Every option must be a realistic action a student might actually take; no option may sound stupid, lazy, heroic or morally superior.',
 'Interests & likings':'Use the student’s actual interests, hobbies and likings. Ask how they would explore, learn, build, discuss, observe or spend time on that exact item. Options must stay on the same topic and be equally natural.',
 'Basic intelligence':'Use varied, age-appropriate reasoning: number pattern, simple arithmetic, ordering, classification, word logic or spatial reasoning. Exactly one correct answer. Do not make questions depend on the student’s career, stream or prior subject knowledge.',
 'Strong subject / skills':'Use the student’s actual strong subjects and verified skills. Factual questions are allowed only when the subject/skill and level justify them. Otherwise ask how they learn, practise or apply that subject/skill. Never punish a student for not knowing an advanced topic.',
 'Career opinion':'Use the student’s own stated field, preferred roles, alternatives and reasons. Ask about reflection, priorities, uncertainty, trade-offs, exploration and next steps. Never tell the student which career is better; do not turn the non-negotiable career into the correct answer.'
};
function buildTestPrompt(vault,stage){
  const plan=TQ_PLAN.map(([cat,n])=>`${cat}: exactly ${n}`).join('\n');
  const vaultItems=[
    ['Interests',arr(vault.interests)],
    ['Hobbies',arr(vault.hobbies)],
    ['Likings',arr(vault.likings)],
    ['Strong subjects',arr(vault.strongSubjects)],
    ['Preferred roles',arr(vault.preferredRolesInPriorityOrder)],
    ['Verified skills',arr(vault.verifiedSkills)],
    ['Chosen field',vault.chosenField||vault.field||''],
    ['Non-negotiable career',vault.nonNegotiableCareer||vault.nonnegotiable||''],
    ['Alternatives',arr(vault.alternativesConsidered)]
  ].flatMap(([label,items])=>arr(items).filter(Boolean).map(x=>`- ${label}: ${typeof x==='string'?x:(x&&x.name)||String(x)}`));
  const vaultItemText=vaultItems.join('\n')||'- No detailed Vault item was supplied.';
  return `You are CareerMitra's neutral Test Zone designer. You are designing a self-discovery test, not selling a career and not trying to prove a predetermined personality type.

STUDENT LIFE STAGE: ${stage}
QUESTION PLAN:
${plan}
TOTAL: ${TQ_N}

PERSONAL VAULT — THIS IS THE ONLY PERSONAL EVIDENCE YOU MAY USE:
${JSON.stringify(vault)}
EXACT VAULT ITEMS AVAILABLE FOR PERSONALISATION:
${vaultItemText}

NON-BIAS PRINCIPLES
- Start from the student's actual information only. Do not add facts that are not present.
- No career, degree, stream, employer type, salary level, government job, medical field, technology field, business field, creative field or any other direction is inherently better.
- A non-negotiable career, preferred role, chosen field or alternative is a preference signal only. Never turn it into a correct answer or repeatedly steer toward it.
- Do not use gender, family income, location, school, marks, prestige or stereotypes to steer the student.
- Do not infer ability, intelligence, maturity or character from a single preference.

QUESTION QUALITY
- Use very simple, polite English. One clear idea per question.
- Every option must be a realistic answer a student could honestly choose.
- Four options must be comparable in tone, length, specificity and emotional value.
- Do NOT create one “good”, “smart”, “safe”, “kind”, “ambitious”, “successful” or “mature” option.
- Do NOT create silly, extreme, lazy, heroic, insulting, impossible or obviously fake options.
- Avoid double negatives, hidden assumptions, emotionally loaded wording and career-selling language.
- Do not repeat a question or reuse the same exact Vault item unnecessarily.
- For interest questions, keep all four options about the same real activity or topic; vary only the way the student might engage with it.
- For situation questions, all four options must be reasonable responses, with no moral winner.
- For career-opinion questions, ask about the student's own priorities and uncertainty; never ask which career is “best”.

CATEGORY RULES
${Object.entries(CAT_RULES).map(([k,v])=>`${k}: ${v}`).join('\n')}

PERSONALISATION REQUIREMENTS
- Interests & likings: at least 3 of 4 questions must use different exact items from interests, hobbies or likings. Put the exact item in basedOn and naturally in the question.
- Strong subject / skills: at least 3 of 4 must use different exact subjects or verified skills when those items exist. Never invent a subject or skill.
- Career opinion: use the actual field, preferred roles, alternatives, non-negotiable career or reasons, but distribute them across the 5 questions and keep every option neutral.
- Personality and Situation reaction may use Vault context only when it makes the situation natural; they must not become career questions.
- Basic intelligence must be independent of the student's career and should use one clear correct answer plus three believable distractors.

TRAIT MAPPING
For non-factual questions, each of the four options must have a different internal Holland code from R,I,A,S,E,C. The code is hidden from the student. Rotate which code appears first and do not repeatedly make one code sound better.
For factual reasoning/knowledge questions, use exactly one correct:true and three plausible, topic-relevant distractors. No nonsense distractors.

SELF-AUDIT BEFORE RETURNING
For every question check: “Could a student reasonably choose any option without being pushed toward a particular career, personality type or socially desirable answer?” If not, rewrite it.
Also check: exact Vault grounding where required; four distinct plausible options; comparable option length; no repeated stems; no unsupported personal facts; correct answer only for factual questions.

RETURN ONLY JSON:
{"questions":[{"cat":"Category name","basedOn":"exact Vault source or General reasoning","q":"question","o":[{"text":"option","trait":"R"},{"text":"option","trait":"I"},{"text":"option","trait":"A"},{"text":"option","trait":"S"}]}]}
For factual questions use correct:true/false instead of trait.
Return exactly ${TQ_N} questions with the exact category counts. No markdown. No explanation.`;
}

async function makeQuestions(s){
  const v=s.vault||{};
  const vault={
    interests:arr(v.interests),hobbies:arr(v.hobbies),likings:arr(v.likings),
    strongSubjects:arr(v.subjects).map(x=>`${x.name} (${LEVELS[x.level-1]||'Good'})`),
    preferredRolesInPriorityOrder:roleNames(v),
    verifiedSkills:arr(v.skills).map(x=>`${x.name} (${x.level||''})`),
    nonNegotiableCareer:v.nonnegotiable||'',chosenField:v.field||'',reasonForField:v.whyField||'',
    reasonNotOtherFields:v.whyNotOthers||'',alternativesConsidered:arr(v.alternatives)
  };
  const stage=STAGES[s.stage]?STAGES[s.stage].t+' — '+STAGES[s.stage].d:'student';
  S.tload=0;window.CM_TEST_AI_SOURCES={};
  const prompt=buildTestPrompt(vault,stage);
  let result=await aiJson(prompt,{
    purpose:'student test generation',
    testZone:true,
    bypassCache:true,
    vault,
    stage
  });
  let all=validQuestions(result,TQ_N)||[];
  // The backend Test Zone route performs the authoritative structural and
  // Personal-Vault validation. Do not reject a valid server-validated test
  // again with the older, stricter client heuristics.
  const serverValidated=Boolean(result&&result._serverValidated);
  let issues=all.length===TQ_N
    ? (serverValidated ? [] : questionQualityIssues(all,v))
    : ['AI response was incomplete or structurally invalid.'];

  // IMPORTANT: do not make a second long AI request here.
  // The backend already performs the Test Zone generation and validation.
  // If the endpoint fails or returns an invalid payload, use the emergency
  // local fallback immediately instead of creating another 30–50 second request.

  if(all.length===TQ_N && !issues.length){
    const q=all.map(x=>({...x,cat:String(x.cat).trim(),source:'ai'}));
    const sources={};TQ_PLAN.forEach(([cat])=>sources[cat]='ai');
    window.CM_TEST_AI_SOURCES=sources;
    S.tload=TQ_PLAN.length;if(S.tstate==='loading')render(true);
    return{q,src:'ai',sources};
  }

  // Last-resort safety net only. Keep any valid AI category and use the local
  // generator only for categories that could not be recovered. This allows the
  // Test Zone indicator to honestly show green/blue/orange/pink instead of
  // turning the entire 25-question test into fallback after one bad category.
  const out={};const sources={};
  const aiByCat={};
  if(Array.isArray(all)&&all.length){
    for(const q of all){
      const cat=String(q.cat||'').trim();
      if(TQ_PLAN.some(([c])=>c===cat)){
        (aiByCat[cat]||(aiByCat[cat]=[])).push({...q,cat});
      }
    }
  }
  for(const [cat,n] of TQ_PLAN){
    if((aiByCat[cat]||[]).length===n){
      out[cat]=aiByCat[cat];
      sources[cat]='ai';
    }else{
      out[cat]=localCat(v,cat,n);
      sources[cat]='builtin';
    }
  }
  window.CM_TEST_AI_SOURCES=sources;
  const q=TQ_PLAN.flatMap(([cat])=>(out[cat]||[]).map(x=>({...x,source:sources[cat]==='ai'?'ai':'builtin'})));
  if(q.length!==TQ_N){window.CM_AI_ERROR='The AI could not produce a valid complete test, and the recovery test was incomplete.';return null;}
  S.tload=TQ_PLAN.length;if(S.tstate==='loading')render(true);
  return{q,src:'fallback',sources};
}

function aiCareerRecord(cand,i,st){
  const name=String(cand&&cand.name||cand&&cand.career||'').trim();

  const fit=String(cand&&cand.fit||'Possible');
  const role={
    n:name||'Career direction',

    score:typeof cand?.score==='number'?cand.score:(fit.toLowerCase()==='strong'?0.9:fit.toLowerCase()==='moderate'?0.7:0.5),
    vaultMatch:!!(st.vault&&[st.vault.nonnegotiable,...roleNames(st.vault),st.vault.field].filter(Boolean).some(x=>String(x).trim().toLowerCase()===name.toLowerCase())),
    strong:arr(cand&&cand.evidence).map(String),

    aiPath:arr(cand&&cand.path).map(String),
    aiAlternatives:arr(cand&&cand.alternatives).map(String),
    // EVERYTHING below is supplied by the AI career-profile analysis.
    pros:arr(profile.pros).map(String),
    cons:arr(profile.cons).map(String),
    mkt:String(profile.market||''),
    demand:String(profile.demand||''),
    future:String(profile.future||''),
    pay:String(profile.pay||''),
    education:String(profile.education||''),
    vocational:String(profile.vocational||''),
    courses:arr(profile.courses).map(String),
    path:arr(profile.path).map(String),
    skills:arr(profile.skills).map(String),
    alt:arr(profile.alternatives).map(String),
    profileSummary:String(profile.summary||''),
    profileCaution:String(profile.caution||'')
  };
  if(!role.pros.length)role.pros=['AI profile did not provide enough evidence for a reliable pro/con claim.'];
  if(!role.cons.length)role.cons=['AI profile did not provide enough evidence for a reliable pro/con claim.'];
  if(!role.mkt)role.mkt='Market information was not confidently established by the AI analysis.';
  if(!role.demand)role.demand='Demand could not be established confidently from the student evidence alone.';
  if(!role.future)role.future='Future outlook was not established confidently by the AI analysis.';
  if(!role.education)role.education='Education pathway needs career-specific verification before the student makes a decision.';
  if(!role.vocational)role.vocational='No reliable vocational route was established by the AI analysis.';
  if(!role.courses.length)role.courses=['Choose only courses that directly support the verified pathway for this role.'];
  if(!role.path.length)role.path=['Verify the required qualification or training, build the core skills, gain practical experience, and then apply through the appropriate entry route.'];
  if(!role.skills.length)role.skills=['Build the core technical and professional skills required by the verified role.'];
  if(!role.alt.length)role.alt=role.aiAlternatives;
  return role;
}
function careerAnalysisReady(st){

function analyse(st){
  const tally=st.test&&st.test.tally?st.test.tally:{R:0,I:0,A:0,S:0,E:0,C:0};
  const total=LET.reduce((a,k)=>a+(tally[k]||0),0)||1;
  const share={};LET.forEach(k=>share[k]=(tally[k]||0)/total);
  const order=[...LET].sort((a,b)=>share[b]-share[a]);
  const v=st.vault||{};
  const ai=st.test&&st.test.ai||{};

  // The AI result is the primary career analysis. The Holland tally remains only a transparent
  // description of how the student answered the option-style questions; it never selects a career.
  const aiList=arr(ai.rankedCareers).filter(x=>x&&typeof x.name==='string'&&x.name.trim()).slice(0,8);
  let roles=[];
  if(aiList.length){
    roles=aiList.map((x,i)=>aiCareerRecord(x,i,st));
  }
  // No deterministic career guessing here. If the AI analysis fails, we do NOT
  // manufacture job matches from the old static career database. This is deliberate:
  // the Scorecard must never present a false student-specific analysis as AI truth.
  const unmatched=[];
  const [a,b]=order;
  const type=`${TR[a].who}–${TR[b].who} (${a}${b})`;
  const defaultTraits=[...TR[a].t,...TR[b].t.slice(0,3),...TR[order[2]].t.slice(0,1)];
  const aiTraits=arr(ai.traits).map(String).filter(Boolean);
  const aiCore=arr(ai.coreInterests).map(String).filter(Boolean);
  const aiDirections=arr(ai.careerDirections).map(String).filter(Boolean);
  return{share,order,roles,unmatched,
    type:ai.personalityType||type,
    traits:aiTraits.length?aiTraits:defaultTraits,
    overall:ai.summary||`Your responses show a ${TR[a].who.toLowerCase()}-led pattern with ${TR[b].who.toLowerCase()} strengths.`,
    inclined:aiDirections.length?aiDirections:arr(ai.inclined).length?arr(ai.inclined):[TR[a].cat,TR[b].cat],
    interests:aiCore.length?aiCore:[...new Set([v.field,...arr(v.interests),...arr(v.hobbies),...arr(v.likings)].filter(Boolean))].slice(0,10),
    source:(aiList.length&&String(st.test&&st.test.aiSource||'').toLowerCase()==='ai')?'ai':'unavailable'};
}

function localGenuine(a,others){
  const w=a.trim().split(/\s+/).filter(Boolean);
  if(w.length<3)return'Please answer in at least 3 words so we can understand your concern.';
  if(/(.)\1{4,}/.test(a)||!/[aeiou]/i.test(a))return'This looks like random text. Please write your honest answer.';
  if(new Set(w.map(x=>x.toLowerCase())).size/w.length<0.5)return'This answer is very repetitive. Please explain in your own words.';
  if(others.some(o=>o&&o.trim().toLowerCase()===a.trim().toLowerCase()))return'This is identical to another answer. Please give a separate, specific answer.';
  return null;
}
function concernNote(text,an){
  const t=String(text||'').toLowerCase();
  if(/money|salary|income|fee|loan|financ|afford|pay|cost/.test(t))return'Financial topic recorded. CareerMitra will compare the stated concern with verified market information rather than assuming that higher pay is better.';
  if(/society|people|relative|respect|neighbo|log kya|status|prestige|shame/.test(t))return'Social or family-expectation topic recorded. This is treated as the family’s perspective, not as a reason that a career is objectively better.';
  if(/scope|future|growth|demand|trend|stable|security/.test(t))return'Future or stability topic recorded. Current evidence and uncertainty are kept separate in the analysis.';
  if(/stream|science|commerce|arts|degree|engineer|doctor|prefer/.test(t))return'Education or career preference recorded. It is compared with the student’s evidence rather than treated as a correct choice.';

}

function testAIStatus(){
  const src=window.CM_TEST_AI_SOURCES||{};
  let aiCount=0,fallbackCount=0;

  // Prefer question-level source data when available.
  const tq=S.tq&&Array.isArray(S.tq.q)?S.tq.q:[];
  if(tq.length){
    tq.forEach(q=>{
      const source=String(q&&q.source||q&&q.aiSource||'').toLowerCase();
      if(source==='ai'||source==='generated'||source==='openrouter')aiCount++;
      else if(source==='builtin'||source==='fallback'||source==='local')fallbackCount++;
    });
  }

  // Current generator stores category-level sources. Use them when question-level
  // source metadata is unavailable.
  if(!aiCount&&!fallbackCount){
    Object.values(src).forEach(x=>{
      if(x==='ai')aiCount++;
      else if(x==='builtin'||x==='fallback')fallbackCount++;
    });
    // Each category represents its planned number of questions.
    if(Object.keys(src).length){
      aiCount=0;fallbackCount=0;
      TQ_PLAN.forEach(([cat,n])=>{
        if(src[cat]==='ai')aiCount+=n;
        else if(src[cat]==='builtin'||src[cat]==='fallback')fallbackCount+=n;
      });
    }
  }

  const total=aiCount+fallbackCount;
  let color='orange',label='AI status unavailable';
  if(total){
    const ratio=aiCount/total;
    if(aiCount===total){color='green';label='100% AI Generated';}
    else if(ratio>=0.70){color='blue';label='Mostly AI Generated';}
    else if(ratio>=0.40){color='orange';label='AI + Fallback';}
    else{color='pink';label='Mostly Fallback';}
  }

  const aiPct=total?Math.round(aiCount/total*100):0;
  const fbPct=total?Math.round(fallbackCount/total*100):0;
  const detail=total?`${label} · ${aiPct}% AI · ${fbPct}% fallback`:'AI status unavailable';
  return `<span class="cm-ai-status ${color}" title="${esc(detail)}" aria-label="${esc(detail)}"><span class="cm-ai-dot"></span><span>${esc(label)}</span></span>`;
}

function careerRecord(name){
  const q=String(name||'').trim().toLowerCase();
  if(!q)return null;
  return CAREERS.find(c=>c.n.toLowerCase()===q)||CAREERS.find(c=>c.kw.some(k=>q.includes(k)||k.includes(q)))||null;
}
function learningPath(r){
  const ai=r||{};
  return {
    academic:ai.education||'Education pathway not confidently established by AI.',
    vocational:ai.vocational||'No reliable vocational route established by AI.',
    cert:arr(ai.courses).length?arr(ai.courses):['No specific course/certification recommendation established by AI.'],
    skills:arr(ai.skills).length?arr(ai.skills):['Core role skills need to be verified before selection.'],
    path:arr(ai.path),
    market:ai.mkt||'Market information not confidently established by AI.',
    demand:ai.demand||'Demand not confidently established by AI.',

}

function scoreStudent(){
  if(S.uid&&DB.students[S.uid])return DB.students[S.uid];
  if(!S.score)return null;
  const u=DB.users.find(x=>x.id===S.score);
  if(!u)return null;
  if(u.role==='student')return DB.students[u.id]||null;
  if(u.role==='family'){
    const f=DB.families[u.id];
    const r=f&&f.profile&&studentByCode(f.profile.linkCode);
    return r?r[1]:null;
  }
  return null;
}

function anchorConcernCheck(text,r){
  const t=String(text||'').toLowerCase(),m=String(r.mkt||'').toLowerCase();
  if(/salary|income|pay|earning|money|financial|fee|cost|loan|afford/.test(t))return`Salary/financial concern → ${r.n?r.n+' market reference: '+r.mkt:'compare this career against its actual education cost and expected earnings.'}`;
  if(/scope|future|growth|demand|trend/.test(t))return`Future-scope concern → ${m?('The current role record says: '+r.mkt):'This needs a current market check before making a conclusion.'}`;
  if(/security|stable|stability|job/.test(t))return`Job-security concern → review the role’s demand, employer mix and entry competition; this is a trade-off rather than a guarantee.`;
  if(/stream|degree|study|education|college|exam/.test(t))return`Education concern → the learning pathway above shows the usual academic/vocational routes and the skills that need to be built.`;
  if(/home|away|relocat|transfer/.test(t))return`Location concern → this depends on employer and role type; government, private and remote opportunities can differ.`;
  return`Concern recorded → compare it with the career’s pros, trade-offs, market information and learning pathway above.`;
}

  function explicitMatch(answer,c){

  }

    const matched=[],conflicts=[];
    acceptedConcerns.forEach(sig=>{
      const q=sig.q.toLowerCase(),a=sig.a.toLowerCase(),t=q+' '+a,hay=careerText(c);
      if(explicitMatch(sig.a,c.n)){
        matched.push({label:'Family explicitly mentioned this career',a:sig.a});
        return;
      }
      // Generic support, “money is no problem”, “whatever he wants”, etc. is context only.
      if(/whatever|no problem|no issue|dont care|don\.?t care|full support|i support|trust him|trust her|his life|her life|money is no problem|salary is no problem/.test(a))return;
      const d=concernDimension(q,sig.a); if(!d)return;
      let pos=false,neg=false,label='';
      if(d==='finance'){label='financial concern';pos=/salary|pay|earning|income|demand|market/.test(hay);neg=/high cost|expensive|low pay|uncertain income/.test(hay)}
      if(d==='stability'){label='stability concern';pos=/stable|security|secure|steady|government|public sector/.test(hay);neg=/uncertain|volatile|unstable|contract|high risk/.test(hay)}
      if(d==='future'){label='future-scope concern';pos=/demand|growth|growing|future|expanding|opportunit/.test(hay);neg=/declin|shrinking|uncertain future/.test(hay)}
      if(d==='social'){label='social-respect concern';pos=/respect|prestige|professional|mission/.test(hay);neg=/low respect|stigma/.test(hay)}
      if(d==='location'){label='location concern';pos=/remote|local|hybrid|flexible/.test(hay);neg=/relocation|transfer|posting|travel|away from home/.test(hay)}
      if(d==='education'){label='education-path concern';pos=/degree|diploma|certif|training|clear path/.test(hay);neg=/very long|long study|phd|postgraduate/.test(hay)}
      if(d==='worklife'){label='work-life concern';pos=/flexible|work life|work-life|regular hours/.test(hay);neg=/stress|long hours|on call|pressure/.test(hay)}
      if(d==='competition'){label='competition concern';pos=/multiple routes|many employers|demand|opportunit/.test(hay);neg=/competitive|high competition|tough exam|low success/.test(hay)}
      if(d==='risk'){label='career-risk concern';pos=/stable|security|multiple routes|demand|alternative/.test(hay);neg=/uncertain|high risk|variable/.test(hay)}
      if(pos)matched.push({label,a:sig.a}); if(neg)conflicts.push({label,a:sig.a});
    });
    return{matched,conflicts};
  }
  const byName=name=>candidates.find(c=>norm(c.n)===norm(name));
  const ordered=(aiOrder.map(byName).filter(Boolean).concat(candidates.filter(c=>!aiOrder.some(n=>norm(n)===norm(c.n))))).slice(0,8);
  const scored=ordered.map((c,i)=>{const fe=familyEvidence(c);const studentFit=Math.max(0,Math.min(100,Math.round((c.score||0)*100)));const total=(fe.matched.length*18)-(fe.conflicts.length*14)+(c.vaultMatch?10:0);return{c,fe,studentFit,total}});
  const eligible=scored.filter(x=>x.fe.matched.length>0&&!x.fe.conflicts.length).sort((a,b)=>b.total-a.total);
  const picks=(aiOrder.length?aiOrder.map(byName).filter(Boolean).map(c=>scored.find(x=>x.c===c)).filter(x=>x&&x.fe.matched.length&&!x.fe.conflicts.length):eligible).slice(0,3);
  const maxStudent=Math.max(1,...scored.map(x=>x.studentFit));
  return`<div class="card" style="border-width:2px;border-color:var(--brand)">
    <div class="row sp"><div><div class="muted small">Family + Student intersection</div><h2 style="margin:3px 0">🎯 ${picks.length?'Evidence-based common ground':'No clear common ground found yet'}</h2></div><span class="pill y">Student evidence + ${acceptedConcerns.length} family answers${aiOrder.length?' · AI cross-checked':''}</span></div>
    <p class="muted small">Only the student’s own Test Zone/Vault evidence and the family’s actual answers are used. General support statements are not treated as proof for a career. If the evidence does not support an overlap, CareerMitra does not force one.</p>
    ${picks.length?`<div class="grid2" style="margin-top:12px">${picks.map((x,i)=>{const familyPct=Math.max(1,Math.min(99,50+x.fe.matched.length*15-x.fe.conflicts.length*15));const studentPct=Math.max(1,Math.min(99,x.studentFit/maxStudent*100));return `<div class="qa" style="margin:0"><div class="row sp"><b>${i+1}. ${esc(x.c.n)}</b><span class="fit s">Common ground</span></div>
      <p class="small"><b>Why it appears for the student:</b> ${esc(x.c.aiReason||x.c.strong.join(' ')||'The AI analysis found a match in the student’s responses.')}</p>
      ${x.c.strong.length?`<div class="note info small"><b>Student evidence</b><ul style="margin:5px 0 0;padding-left:18px">${x.c.strong.slice(0,5).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div>`:''}
      <div class="note info small" style="margin-top:8px"><b>Family evidence</b><ul style="margin:5px 0 0;padding-left:18px">${x.fe.matched.slice(0,6).map(v=>`<li><b>${esc(v.label)}</b> — “${esc(v.a.slice(0,220))}${v.a.length>220?'…':''}”</li>`).join('')}</ul></div>
      ${x.fe.conflicts.length?`<div class="note bad small" style="margin-top:8px"><b>Trade-offs found</b><ul style="margin:5px 0 0;padding-left:18px">${x.fe.conflicts.slice(0,4).map(v=>`<li>${esc(v.label)} — “${esc(v.a.slice(0,180))}${v.a.length>180?'…':''}”</li>`).join('')}</ul></div>`:''}
      <div class="pc" style="margin-top:10px"><div class="pros"><h4>Pros</h4>${x.c.pros.length?`<ul>${x.c.pros.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'<p class="muted small">Not available in the structured database yet.</p>'}</div><div class="cons"><h4>Cons / trade-offs</h4>${x.c.cons.length?`<ul>${x.c.cons.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`:'<p class="muted small">Not available in the structured database yet.</p>'}</div></div>
      <p class="muted small">The percentages below are evidence indicators, not probability of success or a recommendation.</p><div class="trait"><span>Student evidence</span><div class="bar"><i style="width:${studentPct}%"></i></div><span>${Math.round(studentPct)}%</span></div><div class="trait"><span>Family evidence</span><div class="bar"><i style="width:${familyPct}%"></i></div><span>${familyPct}%</span></div>
    </div>`}).join('')}</div>`:`<div class="note info" style="margin-top:12px"><b>No career is being forced into the common-ground list.</b><br>The current family answers do not provide clear positive evidence for any of the student’s analysed directions without a meaningful conflict. That is a valid result.</div>`}
    <p class="muted small" style="margin-bottom:0">This is decision support, not a verdict. The student’s personal choice remains visible separately, and uncertainty or disagreement is kept visible.</p>
  </div>`;
}
async function requestCommonGroundAI(){
  try{
    if(S.view!=='score'||!S.score)return;
    const u=DB.users.find(x=>x.id===S.score);if(!u)return;
    let s,fams;
    if(u.role==='student'){s=DB.students[u.id];fams=linkedFamilies(s)}
    else{const f=DB.families[u.id];const r=f.profile&&studentByCode(f.profile.linkCode);s=r?r[1]:null;fams=s?linkedFamilies(s):[]}
    if(!s||!studentDone(s))return;
    const acceptedConcerns=fams.flatMap(([id,f])=>arr(f.qa).filter(x=>x.accepted&&String(x.a||'').trim()).map(x=>({question:String(x.q||''),answer:String(x.a||''),aiInterpretation:x.ai||null})));
    if(!acceptedConcerns.length)return;
    const key=JSON.stringify({rev:s.vault&&s.vault.rev,test:s.test&&s.test.takenAt,family:acceptedConcerns});
    if(s.commonGroundAI&&s.commonGroundAI.key===key)return;
    if(s.commonGroundAIPending)return;
    s.commonGroundAIPending=true;
    const an=analyse(s);
    const careers=an.roles.map(c=>({name:c.n,profile:c.c,market:c.mkt,pros:c.pros,cons:c.cons,alternatives:c.alt,evidence:c.strong,watchouts:c.watch,reason:c.aiReason||''}));
    const prompt=`You are CareerMitra's strict Common Ground decision-support analyst.\n\nYour job is NOT to make generic career suggestions. Select up to 3 careers only after comparing BOTH sides.\n\nSTUDENT TEST ANALYSIS:\n${JSON.stringify({personalityType:an.type,personalityShare:an.share,rankedCareers:an.roles.slice(0,8).map(r=>({name:r.n,rank:r.rank,fitEvidence:r.strong,watchouts:r.watch})),vault:{interests:s.vault.interests,hobbies:s.vault.hobbies,likings:s.vault.likings,strongSubjects:subjNames(s.vault),skills:skillNames(s.vault),preferredRoles:roleNames(s.vault),field:s.vault.field,nonNegotiable:s.vault.nonnegotiable,alternatives:s.vault.alternatives}})}\n\nACCEPTED FAMILY CONCERNS (use the actual answers, not assumptions):\n${JSON.stringify(acceptedConcerns)}\n\nCAREER CANDIDATES:\n${JSON.stringify(careers)}\n\nSTRICT RULES:\n1. A career must have evidence of student fit AND evidence addressing at least one real family concern.\n2. Never claim a family concern is satisfied unless the career data actually supports it.\n3. If a career conflicts with an important concern, record the conflict. Do not hide it.\n4. Do not select a career merely because it is popular, high-paying, or already the non-negotiable career.\n5. The student's non-negotiable career must remain visible separately; it may be selected only if BOTH sides support it.\n6. Use the student's Test Zone pattern, not just their typed preference.\n7. Use the parent's actual wording as evidence.\n8. If fewer than 3 careers genuinely satisfy both sides, return fewer than 3. NEVER fill the list with weak or invented matches.\n9. Return only JSON.\n\nFORMAT:\n{"picks":[{"career":"exact candidate name","studentEvidence":["..."],"familyEvidence":["..."],"conflicts":["..."],"fit":"Strong|Moderate","reason":"short explanation"}]}`;
    let ai=await aiJson(prompt);
    let picks=Array.isArray(ai&&ai.picks)?ai.picks.filter(x=>x&&typeof x.career==='string').slice(0,3):[];
    if(!picks.length && !/429|rate limit|rate_limit|quota/i.test(window.CM_AI_ERROR||'')){
      ai=await aiJson(prompt+`\n\nRECOVERY PASS: Re-evaluate the evidence-gated candidates. Return up to 3 genuine common-ground careers only. If the evidence does not support 3, return fewer. JSON only.`,{bypassCache:true});
      picks=Array.isArray(ai&&ai.picks)?ai.picks.filter(x=>x&&typeof x.career==='string').slice(0,3):[];
    }
    if(picks.length){s.commonGroundAI={key,picks,createdAt:Date.now()};save();}
    delete s.commonGroundAIPending;
    if(S.view==='score')render(true);
  }catch(e){
    const s=stu();if(s)delete s.commonGroundAIPending;
  }
}
